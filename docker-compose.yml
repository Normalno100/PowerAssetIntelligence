name: power-asset-intelligence

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    container_name: power-asset-postgres
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC
      SERVICE_NAME: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      <<: *default-logging
      options:
        tag: "postgres"
        env: "SERVICE_NAME"

  kafka:
    image: ${KAFKA_IMAGE:-bitnamilegacy/kafka:3.7.0}
    container_name: power-asset-kafka
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:29092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_CFG_LOG_RETENTION_HOURS: 168
      ALLOW_PLAINTEXT_LISTENER: "yes"
      SERVICE_NAME: kafka
    volumes:
      - kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    logging:
      <<: *default-logging
      options:
        tag: "kafka"
        env: "SERVICE_NAME"

  ml-service:
    build:
      context: ./ml-service
      args:
        MODEL_VERSION: ${MODEL_VERSION:-dev}
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: power-asset-ml-service
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    environment:
      TZ: UTC
      SERVICE_NAME: ml-service
      ML_API_KEY: ${ML_API_KEY:-ml-dev-key-change-me}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    logging:
      <<: *default-logging
      options:
        tag: "ml-service"
        env: "SERVICE_NAME"

  app:
    build:
      context: .
    container_name: power-asset-api
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-secured}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics,prometheus
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: always
      # JVM heap = 75% от container limit (512M * 0.75 = 384M heap, ~128M metaspace/native)
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -XX:MinRAMPercentage=40.0"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TELEMETRY_RAW_TOPIC: ${KAFKA_TELEMETRY_RAW_TOPIC:-telemetry.raw.v1}
      KAFKA_TELEMETRY_DLT_TOPIC: ${KAFKA_TELEMETRY_DLT_TOPIC:-telemetry.raw.v1.dlt}
      LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT:-INFO}
      SERVICE_NAME: app
      SECURITY_JWT_SECRET: ${SECURITY_JWT_SECRET:-dev-secret-do-not-use-in-production-at-least-32-chars-long}
      ML_API_KEY: ${ML_API_KEY:-ml-dev-key-change-me}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 45s
    logging:
      <<: *default-logging
      options:
        tag: "app"
        env: "SERVICE_NAME"

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: power-asset-prometheus
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=14d"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      app:
        condition: service_started
    environment:
      SERVICE_NAME: prometheus
    logging:
      <<: *default-logging
      options:
        tag: "prometheus"
        env: "SERVICE_NAME"

  loki:
    image: grafana/loki:3.1.1
    container_name: power-asset-loki
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.1'
        reservations:
          memory: 64M
          cpus: '0.05'
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./ops/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    environment:
      SERVICE_NAME: loki
    logging:
      <<: *default-logging
      options:
        tag: "loki"
        env: "SERVICE_NAME"

  fluent-bit:
    image: fluent/fluent-bit:3.0.9
    container_name: power-asset-fluent-bit
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.1'
        reservations:
          memory: 32M
          cpus: '0.05'
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./ops/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - fluent-bit-db:/tmp/fluent-bit-db
    depends_on:
      - loki
    logging: *default-logging


  frontend:
    build:
      context: ./frontend
    container_name: power-asset-frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.1'
        reservations:
          memory: 32M
          cpus: '0.05'
    depends_on:
      app:
        condition: service_started
    environment:
      TZ: UTC
      SERVICE_NAME: frontend
      VITE_API_BASE_URL: /api
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ops/nginx/.htpasswd:/etc/nginx/conf.d/.htpasswd:ro
    logging:
      <<: *default-logging
      options:
        tag: "frontend"
        env: "SERVICE_NAME"

  grafana:
    image: grafana/grafana:11.1.5
    container_name: power-asset-grafana
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_DEFAULT_THEME: dark
      GF_INSTALL_PLUGINS: grafana-piechart-panel
      SERVICE_NAME: grafana
    volumes:
      - grafana-data:/var/lib/grafana
      - ./ops/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./ops/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
      - loki
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q ok"]
      interval: 20s
      timeout: 5s
      retries: 8
    logging:
      <<: *default-logging
      options:
        tag: "grafana"
        env: "SERVICE_NAME"

volumes:
  postgres-data:
  kafka-data:
  prometheus-data:
  grafana-data:
  loki-data:
  fluent-bit-db:
