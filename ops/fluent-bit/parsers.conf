[PARSER]
    Name        docker
    Format      json
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S.%L

[PARSER]
    Name        syslog
    Format      regex
    Regex       ^(?<time>(?:\w+ +)+\d+ +\d+:\d+:\d+)(?:[^\S\n]+(?<host>\S+))?(?:[^\S\n]+(?<ident>\S+?)[[(?<pid>\d+)]]?[^\S\n]?:)?[^\S\n]?(?<message>.+)$
    Time_Key    time
    Time_Format %b %d %H:%M:%S
