[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name              tail
    Path              /var/lib/docker/containers/**/*.log
    Parser            docker
    Tag               docker.*
    Read_from_Head    true
    DB                /tmp/fluent-bit-db/fluent-bit.db
    Mem_Buf_Limit     5MB
    Skip_Long_Lines   On
    Refresh_Interval  10
    Rotate_Wait       30
    Restart_Leftovers true

[FILTER]
    Name                parser
    Match               docker.*
    Key_Name            log
    Parser              docker
    Reserve_Data        true

[FILTER]
    Name                record_modifier
    Match               docker.*
    Remove_key          stream
    Remove_key          source

[OUTPUT]
    Name                loki
    Match               docker.*
    Host                loki
    Port                3100
    Loki_URL            /loki/api/v1/push
    Labels              {job="docker"}
    Label_service       $SERVICE_NAME
    Label_container     $container
    Metadata_LabelKeys  container
    Metadata_LabelDrop  __*
    Auto_Kubernetes_Labels   false
    K8s-Logging.Parser   enable
    K8s-Logging.Exclude  on
